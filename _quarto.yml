project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "feed/**/*.qmd"

website:
  title: "David C. Francis"
  description: "Empirical labor and development economics; firm-level measurement."
  site-url: https://davidcfrancis.github.io

  navbar:
    title: "David C. Francis"
right:
  - href: index.qmd
    text: About
  - href: research.qmd
    text: Research
  - href: feed/index.qmd
    text: What I'm reading
  - href: code.qmd
    text: Code
    tools:
      - icon: envelope
        href: "mailto:davidcfrancis@gmail.com"
        text: Email
      - icon: linkedin
        href: https://linkedin.com/in/david-francis
        text: LinkedIn
      - icon: github
        href: https://github.com/davidcfrancis
        text: GitHub

  page-footer:
    left: "© 2026 David C. Francis"
    right: "Built with [Quarto](https://quarto.org). Views expressed here are my own and do not necessarily represent those of the World Bank, its Executive Directors, or the governments they represent."

format:
  html:
    pagetitle: "David C. Francis - personal website"
    theme:
      - cosmo
      - styles.scss
    toc: false
    anchor-sections: false
    link-external-newwindow: true
    smooth-scroll: true
    mainfont: "Source Sans 3"
